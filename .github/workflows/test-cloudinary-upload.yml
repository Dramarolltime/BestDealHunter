name: Test Cloudinary Image Upload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cloudinary-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify credentials and upload one existing illustrative image
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import os, pathlib, time, hashlib, hmac, json, urllib.request, urllib.parse
          from uuid import uuid4
          name=os.getenv("CLOUDINARY_CLOUD_NAME","")
          key=os.getenv("CLOUDINARY_API_KEY","")
          secret=os.getenv("CLOUDINARY_API_SECRET","")
          if not all((name,key,secret)):
              raise SystemExit("Missing Cloudinary credentials in repository Actions secrets")
          image=pathlib.Path("images/generated/delsey-duffel-professional.jpg")
          if not image.is_file():
              raise SystemExit("Test image not found")
          timestamp=str(int(time.time()))
          public_id="bestdealhunter-test-"+uuid4().hex[:12]
          params={"timestamp":timestamp,"public_id":public_id,"upload_preset":"bestdealhunter"}
          sign_string="&".join(f"{k}={v}" for k,v in sorted(params.items()))
          signature=hashlib.sha1((sign_string+secret).encode()).hexdigest()
          boundary="----BestDealHunter"+uuid4().hex
          fields={**params,"api_key":key,"signature":signature}
          body=b""
          for k,v in fields.items():
              body+=(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n").encode()
          body+=(f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"test.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n").encode()+image.read_bytes()+b"\r\n"
          body+=(f"--{boundary}--\r\n").encode()
          url=f"https://api.cloudinary.com/v1_1/{urllib.parse.quote(name,safe='')}/image/upload"
          request=urllib.request.Request(url,data=body,headers={"Content-Type":f"multipart/form-data; boundary={boundary}"},method="POST")
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  result=json.load(response)
          except Exception as exc:
              raise SystemExit(f"Cloudinary upload test failed: {type(exc).__name__} (inspect HTTP response in workflow if needed)") from None
          if not result.get("secure_url","").startswith("https://res.cloudinary.com/"):
              raise SystemExit("Cloudinary did not return a usable secure_url")
          print("Cloudinary upload successful.")
          print("Hosted image URL:",result["secure_url"])
          print("Note: This is a connectivity test using existing illustrative art, not a new Instagram post.")
          PY
