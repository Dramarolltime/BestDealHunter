name: Verify retailer listings (read-only)
# Loads each candidate/published product page in headless Chrome and records what the
# retailer shows (price, availability, seller, reference price). No cart, no account, no secrets.
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/verify_listings.py', '.github/workflows/verify-listings.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - name: Check live retailer pages
        run: python scripts/verify_listings.py deal-review-queue.json deals.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verify-results
          path: verify-results.json
