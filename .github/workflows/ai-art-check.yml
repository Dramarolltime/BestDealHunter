name: AI picture check (one-off)
# Two sample "AI scene from the real listing photo" pictures + cards for review, committed to this branch.
# Nothing published or posted.
on:
  push:
    branches: [claude/ai-art-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'Pillow>=10,<13'
      - name: Two samples
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts && python - <<'PY'
          import json, os, urllib.error
          import ai_product_art as ai, deal_graphics as g
          key = os.environ["OPENAI_API_KEY"]
          out = g.ROOT / "docs" / "ai-art-check"; out.mkdir(parents=True, exist_ok=True)
          for d in json.load(open("../deals.json")):
              cid = g.card_id(d)
              if cid not in ("3213ee9c753b", "b883f4b0ed41"):
                  continue
              photo = (g.ROOT / f"images/source/listing-{cid}.jpg").read_bytes()
              try:
                  data = ai.scene_from_photo(photo, key)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, json.loads(e.read() or b"{}").get("error", {}).get("message"))
                  raise
              (out / f"b-{cid}-scene.jpg").write_bytes(data)
              (g.ROOT / f"images/source/b-{cid}.jpg").write_bytes(data)
              dd = dict(d, image_source=f"images/source/b-{cid}.jpg", image_source_kind=g.AI_SCENE_FROM_PHOTO)
              for kind in g.SIZES:
                  g.save(g.render_card(dd, kind), out / f"b-{cid}-{kind}.jpg")
              print("made", cid)
          PY
      - name: Commit the samples to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ai-art-check
          git commit -m "AI picture check output (option B samples, not published)"
          git push
