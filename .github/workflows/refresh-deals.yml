name: Refresh verified deals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_deal_images.py'
      - 'scripts/test_deal_images.py'
      - '.github/workflows/refresh-deals.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Smoke-test branded graphic rendering
        run: python scripts/test_deal_images.py
      - name: Validate retailer-approved deals
        run: python scripts/refresh_deals.py
      # Do not generate cartoon-like graphics or automatically post them.
      - name: Upload approved existing photos to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/upload_cloudinary_images.py
      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json cloudinary-images.json
          if [ -d images/generated ]; then git add images/generated/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified deals"
            git push
          fi
