name: Generate Demo Product Graphic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Render clearly illustrative duffel test graphic
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          out=Path("images/generated")
          out.mkdir(parents=True,exist_ok=True)
          im=Image.new("RGB",(1080,1080),"white")
          d=ImageDraw.Draw(im)
          def f(n):
              p="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              return ImageFont.truetype(p,n)
          d.rectangle((0,0,1080,150),fill="#101828")
          d.text((55,42),"BestDealHunter",font=f(62),fill="white")
          # Stylized generic camo rolling duffel illustration, intentionally not exact product photography.
          d.rounded_rectangle((90,260,650,760),45,fill="#59664a",outline="#101828",width=18)
          for x,y in [(140,310),(310,370),(500,300),(220,540),(430,590),(115,650)]:
              d.ellipse((x,y,x+150,y+90),fill="#8a7b55")
          d.line((180,260,180,155,350,155,350,260),fill="#101828",width=28)
          d.ellipse((150,730,240,820),fill="#101828");d.ellipse((500,730,590,820),fill="#101828")
          d.text((700,280),"55% OFF",font=f(58),fill="#dc2626")
          d.text((700,390),"$89.99",font=f(76),fill="#101828")
          d.text((700,500),"WAS $199.99",font=f(34),fill="#667085")
          d.text((700,590),"Macy's",font=f(42),fill="#101828")
          d.rectangle((0,900,1080,1080),fill="#101828")
          d.text((55,930),"AI ILLUSTRATION — ACTUAL PRODUCT MAY VARY",font=f(28),fill="white")
          d.text((55,990),"Price and availability subject to change.",font=f(25),fill="white")
          im.save(out/"delsey-duffel-illustration-test.jpg",quality=92,optimize=True)
          PY
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/generated/delsey-duffel-illustration-test.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generate Delsey duffel illustrative test graphic"
            git push
          fi
