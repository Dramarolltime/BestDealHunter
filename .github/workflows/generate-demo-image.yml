name: Generate Demo Product Graphic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-demo-image.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Render clearly illustrative duffel test graphic
        run: |
          python - <<'PY'
          # Professional catalog-style replacement generated locally; no external image hosting needed.
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          out=Path("images/generated")
          out.mkdir(parents=True,exist_ok=True)
          im=Image.new("RGB",(1080,1080),"white")
          d=ImageDraw.Draw(im)
          def f(n):
              p="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              return ImageFont.truetype(p,n)
          d.rectangle((0,0,1080,150),fill="#101828")
          d.text((55,42),"BestDealHunter",font=f(62),fill="white")
          # Stylized generic camo rolling duffel illustration, intentionally not exact product photography.
          d.rounded_rectangle((80,300,665,710),65,fill="#20241d",outline="#101828",width=12)
          d.rounded_rectangle((105,325,640,680),55,fill="#4f5943",outline="#222",width=6)
          for x,y,w,h,c in [(130,355,150,80,"#8a7b55"),(320,390,170,90,"#293328"),(485,335,125,100,"#a19470"),(205,520,180,95,"#2f392c"),(430,545,160,85,"#897b57"),(110,600,130,65,"#333b30")]:
              d.ellipse((x,y,x+w,y+h),fill=c)
          d.line((130,470,610,470),fill="#151515",width=8)
          d.arc((185,240,550,430),180,360,fill="#151515",width=24)
          d.line((165,690,165,760),fill="#151515",width=14); d.line((575,690,575,760),fill="#151515",width=14)
          d.line((180,260,180,155,350,155,350,260),fill="#101828",width=28)
          d.ellipse((150,730,240,820),fill="#101828");d.ellipse((500,730,590,820),fill="#101828")
          d.text((700,280),"55% OFF",font=f(58),fill="#dc2626")
          d.text((700,390),"$89.99",font=f(76),fill="#101828")
          d.text((700,500),"WAS $199.99",font=f(34),fill="#667085")
          d.text((700,590),"Macy's",font=f(42),fill="#101828")
          d.rectangle((0,900,1080,1080),fill="#101828")
          d.text((55,930),"ILLUSTRATIVE DEAL IMAGE — ACTUAL PRODUCT MAY VARY",font=f(28),fill="white")
          d.text((55,990),"Price and availability subject to change.",font=f(25),fill="white")
          im.save(out/"delsey-duffel-professional.jpg",quality=92,optimize=True)
          PY
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/generated/delsey-duffel-professional.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generate Delsey duffel illustrative test graphic"
            git push
          fi
