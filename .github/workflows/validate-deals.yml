name: Validate deal feed
on:
  pull_request:
    paths:
      - 'deals.json'
      - 'scripts/validate-deals.cjs'
      - '.github/workflows/validate-deals.yml'
  push:
    paths:
      - 'deals.json'
      - 'scripts/validate-deals.cjs'
      - '.github/workflows/validate-deals.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-deals.cjs
