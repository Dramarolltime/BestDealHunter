name: Validate deal feed
on:
  pull_request:
    paths:
      - 'deals.json'
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/validate-deals.yml'
  push:
    paths:
      - 'deals.json'
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/validate-deals.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Test validation rules and graphic rendering
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate published offers
        run: python scripts/validate_deals.py
