name: Publish-ready image hosting
# Manually upload one repository image to Cloudinary and print its verified public URL.
# Manual only: pushes never trigger uploads. Nothing is posted to social media.
on:
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Existing repository image (for example images/generated/deal.jpg)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload image and verify Cloudinary URL
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IMAGE_PATH: ${{ inputs.image_path }}
        run: |
          set -euo pipefail
          URL="$(python scripts/cloudinary_upload.py --image "$IMAGE_PATH")"
          echo "Verified hosted image: $URL" >> "$GITHUB_STEP_SUMMARY"
