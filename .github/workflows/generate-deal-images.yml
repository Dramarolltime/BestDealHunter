name: Generate Deal Images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deals.json
      - scripts/generate_deal_images.py
permissions:
  contents: write
concurrency:
  group: deal-images
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate_deal_images.py
      - name: Commit images and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/generated deals.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate promotional images for new deals"
            git push
          fi
