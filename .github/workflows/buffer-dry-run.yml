name: Buffer publisher dry run
# Plans Instagram posts via Buffer and writes them to the job summary.
# DRY RUN ONLY: no Buffer secret is passed and nothing is sent. Live posting is not
# implemented until the Buffer API/auth is confirmed and INSTAGRAM_PUBLISH_ENABLED is approved.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/publish_buffer.py'
      - 'scripts/deal_graphics.py'
      - 'posts.json'
      - '.github/workflows/buffer-dry-run.yml'
permissions:
  contents: read
concurrency:
  group: buffer-publisher
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Plan posts (dry run)
        run: python scripts/publish_buffer.py
