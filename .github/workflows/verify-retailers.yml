name: Verify deals with retailer data
# Checks queued candidates and published deals against official retailer data
# (scripts/verify_deals.py). verified_date only moves when a retailer response confirms the
# price and online availability in this run. Deals that lose their discount or stock are
# archived (never deleted). Sources without a secret are skipped and reported.
# Writes to deals.json ONLY when the repo variable AUTO_PUBLISH_VERIFIED_DEALS is "true";
# otherwise every run is a dry run (report in the job summary + artifact).
# Never contacts Buffer/Instagram and never receives INSTAGRAM_PUBLISH_ENABLED.
on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_deals.py'
      - 'scripts/test_verify_deals.py'
      - '.github/workflows/verify-retailers.yml'
permissions:
  contents: write
concurrency:
  group: deal-feed-writer
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier safety tests (no network)
        run: python -m unittest scripts/test_verify_deals.py scripts/test_validate_deals.py
      - name: Verify with retailer data
        env:
          BEST_BUY_API_KEY: ${{ secrets.BEST_BUY_API_KEY }}
          APPLY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AUTO_PUBLISH_VERIFIED_DEALS == 'true' }}
        run: |
          if [ "$APPLY" = "true" ]; then python scripts/verify_deals.py --apply; else python scripts/verify_deals.py; fi
      - name: Validate feed after verification
        run: python scripts/validate_deals.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: ignore
      - name: Commit verified changes
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AUTO_PUBLISH_VERIFIED_DEALS == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json pending_deals.json deal-review-queue.json
          if git diff --cached --quiet; then echo "No verified changes."; exit 0; fi
          git commit -m "Verify deals against retailer data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Could not push verified changes"; exit 1
