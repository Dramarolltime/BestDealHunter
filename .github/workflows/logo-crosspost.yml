name: Brand logo cross-post (one-off, owner-approved)
# The single owner-approved BestDealHunter logo post (2026-10-12). Runs ONLY when a label is
# added to this PR; never on push, schedule or merge.
#   `logo-prepare`:           read-only Buffer checks + Cloudinary upload with byte check.
#   `logo-status`:            read-only report of the recorded post and its Instagram link.
#   `logo-publish-approved`:  added BY THE OWNER ONLY. Creates at most ONE live Instagram post via
#                             Buffer using the existing Cloudinary logo. Duplicate protection:
#     1. refuses if any tag refs/tags/brand-logo-post/* exists (lock or recorded post);
#     2. re-verifies the hosted image bytes == the committed logo before anything else;
#     3. creates the lock tag on GitHub (never --force) BEFORE contacting Buffer, so a re-run,
#        a re-added label or a racing run is refused; the lock is never removed automatically;
#     4. one shared concurrency group with every other Buffer job, never cancelled mid-run.
# Never receives INSTAGRAM_PUBLISH_ENABLED and never touches deals or the deal publisher.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: buffer-publisher
  cancel-in-progress: false
jobs:
  checks:
    if: github.event.label.name == 'logo-prepare' || github.event.label.name == 'logo-status'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Tests (no network)
        run: python -m unittest scripts/test_logo_crosspost.py -v
      - name: Run ${{ github.event.label.name }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$LABEL" = "logo-prepare" ]; then python scripts/logo_crosspost.py prepare; else python scripts/logo_crosspost.py status; fi

  publish-once:
    if: github.event.label.name == 'logo-publish-approved' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write  # only to create refs/tags/brand-logo-post/* (lock + post record)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Safety tests first (no network)
        run: python -m unittest scripts/test_logo_crosspost.py -v
      - name: Publish the logo ONCE (refused if already locked or posted)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python scripts/logo_crosspost.py publish
